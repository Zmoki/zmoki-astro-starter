name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels its run in flight. Each main commit is its own group,
# so main runs every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Redirects drift check
        run: npm run check:redirects

      - name: Headers drift check
        run: npm run check:headers

      # `npm ci` wipes node_modules, so restore Astro's optimized images and fonts,
      # the only slow parts to regenerate. Entries are keyed by content hash, so a
      # stale cache is safe; the content store is left out and rebuilt each run.
      # github.sha saves a fresh cache each run; restore-keys pick the latest one.
      # lighthouse.yml restores it with the same paths (they're part of the key).
      - name: Cache Astro images and fonts
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.astro/fonts
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          # On for main so this build matches production; off for PRs.
          PUBLIC_ANALYTICS_ENABLED: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          PUBLIC_CAPTCHA_ENABLED: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - name: Structured data check
        run: npm run check:sd

      - name: Internal link check
        run: npm run check:links

      - name: Sitemap check
        run: npm run check:sitemap

      - name: Image origin check
        run: npm run check:origin
