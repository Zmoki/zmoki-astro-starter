name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels its run in flight. Each main commit is its own group,
# so main runs every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Restore-only, so this workflow and ci.yml don't race to save the same key.
      - name: Restore Astro images and fonts
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.astro/fonts
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.settings.chromeFlags="--headless"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = '.lighthouseci';
            if (!fs.existsSync(resultsPath)) {
              console.log('No lighthouse results found');
              return;
            }

            const files = fs.readdirSync(resultsPath);
            // lhr-*.json are individual reports; manifest.json has no categories
            const lhrFiles = files.filter(file => file.startsWith('lhr-') && file.endsWith('.json'));

            if (lhrFiles.length === 0) {
              console.log('No Lighthouse report files found');
              return;
            }

            const latestFile = lhrFiles.sort().pop();
            const results = JSON.parse(fs.readFileSync(path.join(resultsPath, latestFile), 'utf8'));

            const scores = results.categories;
            const performance = Math.round(scores.performance.score * 100);
            const accessibility = Math.round(scores.accessibility.score * 100);
            const bestPractices = Math.round(scores['best-practices'].score * 100);
            const seo = Math.round(scores.seo.score * 100);

            // Public report links written by the temporary-public-storage upload target
            let reportLinks = '';
            const linksPath = path.join(resultsPath, 'links.json');
            if (fs.existsSync(linksPath)) {
              const links = JSON.parse(fs.readFileSync(linksPath, 'utf8'));
              const items = Object.entries(links).map(([url, report]) => {
                const route = new URL(url).pathname;
                return `- [\`${route}\`](${report})`;
              });
              if (items.length) {
                reportLinks = `\n\n**Full interactive reports** (hosted ~a few days):\n${items.join('\n')}`;
              }
            }

            const comment = `## 🚀 Lighthouse CI Results

            | Category | Score |
            |----------|-------|
            | Performance | ${performance}/100 |
            | Accessibility | ${accessibility}/100 |
            | Best Practices | ${bestPractices}/100 |
            | SEO | ${seo}/100 |
            ${reportLinks}

            📊 [View CI run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
